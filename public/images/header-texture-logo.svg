<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="520" viewBox="0 0 2400 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.22 0 0 0 0 0.42 0 0 0 0.23 0"/>
    </filter>

    <pattern id="weaveV" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="6" fill="rgba(255,255,255,0.07)"/>
    </pattern>

    <pattern id="weaveH" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="rgba(255,255,255,0.05)"/>
    </pattern>

    <radialGradient id="glow" cx="50%" cy="40%" r="56%">
      <stop offset="0%" stop-color="#3b5f94" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#15335b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#071833" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sideVignette" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#031026" stop-opacity="0.82"/>
      <stop offset="22%" stop-color="#061a39" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#0a2246" stop-opacity="0"/>
      <stop offset="78%" stop-color="#061a39" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#031026" stop-opacity="0.82"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>

    <radialGradient id="logoFeather" cx="50%" cy="46%" r="64%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0.82"/>
      <stop offset="82%" stop-color="#fff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <mask id="logoFeatherMask" maskUnits="userSpaceOnUse" x="860" y="-20" width="680" height="580">
      <rect x="860" y="-20" width="680" height="580" fill="url(#logoFeather)"/>
    </mask>
  </defs>

  <rect width="2400" height="520" fill="#071833"/>
  <rect width="2400" height="520" fill="url(#glow)"/>
  <rect width="2400" height="520" fill="url(#sideVignette)"/>
  <rect width="2400" height="520" fill="url(#weaveV)" opacity="0.36"/>
  <rect width="2400" height="520" fill="url(#weaveH)" opacity="0.32"/>
  <rect width="2400" height="520" filter="url(#noise)" opacity="0.55"/>

  <image
    href="/images/tbm-logo.png"
    x="960"
    y="28"
    width="480"
    height="464"
    opacity="0.30"
    mask="url(#logoFeatherMask)"
  />

  <rect width="2400" height="520" fill="url(#vignette)"/>
</svg>
